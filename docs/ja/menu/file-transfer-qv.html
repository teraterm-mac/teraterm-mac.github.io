    <h1>Quick-VAN ([File] Transfer メニュー)</h1>
    <p>
      Quick-VAN プロトコルでファイルを転送します。
    </p>

    <dl>
      <dt>Receive</dt>
      <dd>
	ファイルを受信します。
	その前に BBS のダウンロードコマンドを起動してください。
      </dd>

      <dt><a href="file-transfer-qv-send.html">Send...</a></dt>
      <dd>
	ファイルを送信します。
	その前に BBS のアップロードコマンドを起動してください。
      </dd>
    </dl>

    <p>
      <a href="../usage/tips/quick_van.html">Quick-VANのヒント</a>
