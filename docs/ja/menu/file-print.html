    <h1>Print ([File] メニュー)</h1>

    <h2>"プリント" ダイアログ</h2>
    <p>
      macOS 標準のプリントダイアログが開きます。
      文字は端末のフォントで、白地に黒で印刷されます。
    </p>
    <dl>
      <dt>印刷範囲の選択</dt>
      <dd>
	マウスで文字を選択していないときは、現在の画面を印刷します。<br>
	文字を選択しているときは「選択部分のみ」を選べます。選択すると、選択した文字だけを印刷します。
      </dd>
    </dl>
