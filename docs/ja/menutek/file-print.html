<h1>Print (TEK window [File] メニュー)</h1>

<h2>"プリント" ダイアログ</h2>

<p>macOS 標準のプリントダイアログが開きます。画像は用紙の大きさに合わせて印刷されます。</p>

<dl>

<dt>印刷範囲の選択</dt>
<dd>マウスで領域を選択していないときは、現在の画面を印刷します。<br>
領域を選択しているときは、選択した領域の画像を印刷します。</dd>

</dl>
