<h1>Font (TEK window [Setup] メニュー)</h1>

<p>フォントを変更します｡</p>

<h2>フォント パネル</h2>

<p>macOS 標準のフォントパネルが開きます。選んだフォントはすぐに TEK window に反映されます。</p>

<dl>

<dt id="TEKFont">フォント</dt>
<dd>変更したいフォントをリストの中から選択して下さい。</dd>

<dt>サイズ</dt>
<dd>フォントのサイズをポイント数で指定して下さい｡</dd>

</dl>
