<h1>toupper</h1>

<p>
文字列をすべて大文字に変換する。
</p>

<pre class="macro-syntax">
toupper &lt;strvar&gt; &lt;string&gt;
</pre>

<h2>解説</h2>

<p>
&lt;string&gt; に含まれるアルファベットを全て大文字にし、 &lt;strvar&gt; に代入する。
</p>

<h2>例</h2>

<pre class="macro-example">
; valstrに 'ABCDEFGH' が代入される
toupper valstr 'abCDefGH'
</pre>
