<h1>gettitle</h1>

<p>
ウィンドウタイトル文字列を得る。
</p>

<pre class="macro-syntax">
gettitle &lt;strvar&gt;
</pre>

<h2>解説</h2>

<p>
Tera Term のウィンドウタイトルを文字列変数 &lt;strvar&gt; に格納する。
</p>

<h2>例</h2>

<pre class="macro-example">
gettitle titletext
</pre>
