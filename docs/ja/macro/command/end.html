<h1>end</h1>

<p>
マクロの実行そのものを終了する。
</p>

<pre class="macro-syntax">
end
</pre>

<h2>解説</h2>

<p>
マクロのウインドウも閉じる。<br>
exitコマンドとは厳密に異なる。
</p>
