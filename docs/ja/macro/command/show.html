<h1>show</h1>

<p>
マクロのウインドウの表示状態を変更するコマンド。Tera Term Mac では何もしない。
</p>

<pre class="macro-syntax">
show &lt;show flag&gt;
</pre>

<h2>解説</h2>

<p>
Tera Term Mac では何もしません (Windows のマクロとの互換のために受け付けます)。<br>
マクロのウインドウ (ファイル名・実行中の行と「中断」「終了」ボタン) は、[コントロール] メニューの [マクロウィンドウの表示] で開きます。
</p>
