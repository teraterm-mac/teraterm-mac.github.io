<h1>settime</h1>

<p>
システムの時刻を変更するコマンド。Tera Term Mac では何もしない。
</p>

<pre class="macro-syntax">
settime &lt;time&gt;
</pre>

<h2>解説</h2>

<p>
Tera Term Mac では何もしません (Windows のマクロとの互換のために受け付けます)。<br>
&lt;time&gt; の形式は "HH:MM:SS"。Mac では、アプリからシステムの時計を変えられません。
</p>
