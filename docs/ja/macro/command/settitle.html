<h1>settitle</h1>

<p>
ウィンドウタイトル文字列を変更する。
</p>

<pre class="macro-syntax">
settitle &lt;title&gt;
</pre>

<h2>解説</h2>

<p>
Tera Term のウィンドウタイトルを &lt;title&gt; に変更する。
</p>

<h2>例</h2>

<pre class="macro-example">
settitle 'Tera Term'
</pre>
