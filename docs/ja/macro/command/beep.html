<h1>beep</h1>

<p>
ビープ音を鳴らす。
</p>

<pre class="macro-syntax">
beep [&lt;sound type&gt;]
</pre>


<h2>解説</h2>

<p>
Mac のシステムサウンドを再生する。<br>
引数の意味は以下のとおり。省略時は 5 (既定の警告音) となる。
</p>

<table>
 <tr>
  <th>値</th>
  <th>サウンド</th>
 </tr>
 <tr>
  <td>0</td>
  <td>既定の警告音</td>
 </tr>
 <tr>
  <td>1</td>
  <td>Glass</td>
 </tr>
 <tr>
  <td>2</td>
  <td>Funk</td>
 </tr>
 <tr>
  <td>3</td>
  <td>Basso</td>
 </tr>
 <tr>
  <td>4</td>
  <td>Purr</td>
 </tr>
 <tr>
  <td>5</td>
  <td>既定の警告音</td>
 </tr>
</table>

<h2>例</h2>

<pre class="macro-example">
for i 1 10
	beep 0
	pause 1
next
</pre>
