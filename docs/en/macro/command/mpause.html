<h1>mpause</h1>

<p>
Pauses.
</p>

<pre class="macro-syntax">
mpause &lt;time&gt;
</pre>

<h2>Remarks</h2>

<p>
Pauses for &lt;time&gt; milliseconds.
</p>

<h2>Example</h2>

<pre class="macro-example">
; Pause for 0.2 seconds.
mpause 200

mpause Time
</pre>
