<h1>end</h1>

<p>
Quits the execution of the macro.
</p>

<pre class="macro-syntax">
end
</pre>

<h2>Remarks</h2>

<p>
The macro window is also closed. <br>
This command is not strictly equal to the exit command.
</p>
