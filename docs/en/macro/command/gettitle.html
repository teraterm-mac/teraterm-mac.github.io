<h1>gettitle</h1>

<p>
Gets the window title string.
</p>

<pre class="macro-syntax">
gettitle &lt;strvar&gt;
</pre>

<h2>Remarks</h2>

<p>
Retrieves the title text of Tera Term and stores it in the string variable &lt;strvar&gt;.
</p>

<h2>Example</h2>

<pre class="macro-example">
gettitle titletext
</pre>
